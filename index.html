<!doctype html>
<html lang="en" data-accent="cyan">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Star quest — Lily</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500&display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="app">

  <!-- ============================ top bar ============================ -->
  <div class="topbar">
    <span class="chip chip--quiet" id="statusChip">starting up</span>
    <span class="topbar-spacer"></span>
    <button class="icon-btn" id="themeBtn" type="button" aria-label="Switch between light and dark"></button>
  </div>

  <!-- ============================ welcome ============================ -->
  <section class="screen is-active" id="screen-welcome" aria-labelledby="welcomeTitle">
    <div class="welcome">

      <svg class="mascot mascot--idle" viewBox="0 0 200 220" fill="none" role="img" aria-label="Bolt the robot">
        <!-- antenna -->
        <path d="M100 46V30" stroke="currentColor" stroke-width="4" stroke-linecap="round"/>
        <g class="m-accent">
          <path d="m100 8 5.6 11.4 12.6 1.8-9.1 8.9 2.2 12.5L100 36.7l-11.3 5.9 2.2-12.5-9.1-8.9 12.6-1.8z"
                fill="currentColor"/>
        </g>
        <!-- head -->
        <rect x="46" y="46" width="108" height="80" rx="26" stroke="currentColor" stroke-width="4"/>
        <g class="m-accent" fill="currentColor">
          <circle cx="76" cy="84" r="9"/>
          <circle cx="124" cy="84" r="9"/>
        </g>
        <path d="M84 104a20 20 0 0 0 32 0" stroke="currentColor" stroke-width="4" stroke-linecap="round"/>
        <!-- ears -->
        <path d="M46 78H34M154 78h12" stroke="currentColor" stroke-width="4" stroke-linecap="round"/>
        <!-- body -->
        <rect x="58" y="134" width="84" height="62" rx="20" stroke="currentColor" stroke-width="4"/>
        <g class="m-accent">
          <path d="m100 148 4.4 8.9 9.8 1.4-7.1 6.9 1.7 9.8-8.8-4.6-8.8 4.6 1.7-9.8-7.1-6.9 9.8-1.4z"
                fill="currentColor"/>
        </g>
        <!-- arms -->
        <path d="M58 156H36M142 156h22" stroke="currentColor" stroke-width="4" stroke-linecap="round"/>
        <!-- legs -->
        <path d="M78 196v14M122 196v14" stroke="currentColor" stroke-width="4" stroke-linecap="round"/>
        <path d="M68 212h20M112 212h20" stroke="currentColor" stroke-width="4" stroke-linecap="round"/>
      </svg>

      <h1 id="welcomeTitle">Hi, I'm Bolt!</h1>
      <p class="lede">My rocket lost its four star pieces. Can you help me win them back?</p>

      <label for="nameInput" style="font-size:.95rem;color:var(--muted)">What's your name?</label>
      <input class="name-input" id="nameInput" type="text" value="Lily" autocomplete="off"
             spellcheck="false" maxlength="24">

      <div class="stage-preview" id="stagePreview"></div>

      <button class="btn btn--primary" id="startBtn" type="button">Let's go!</button>
      <p class="lede" style="font-size:.85rem" id="sessionLine"></p>
    </div>
  </section>

  <!-- ============================= quest ============================= -->
  <section class="screen" id="screen-quest" aria-labelledby="stageName">
    <div class="questbar">
      <span class="stage-name" id="stageName"></span>
      <span class="star-track" id="starTrack"></span>
      <span class="pips" id="pips"></span>
    </div>

    <div class="qcard" id="qcard">
      <span class="qkind" id="qkind"></span>
      <div id="qpassage"></div>
      <div class="qtext" id="qtext"></div>
      <div id="qmedia"></div>
      <div id="qbody"></div>
      <div id="qfeedback"></div>
      <div class="actions" id="qactions"></div>
    </div>
  </section>

  <!-- ========================== stage cleared ========================= -->
  <section class="screen" id="screen-stagedone">
    <div class="stage-done">
      <span class="big-star" id="stageDoneStar"></span>
      <h2 id="stageDoneTitle"></h2>
      <p class="lede" id="stageDoneText"></p>
      <button class="btn btn--accent" id="stageNextBtn" type="button">Next stage</button>
    </div>
  </section>

  <!-- ============================= report ============================ -->
  <section class="screen" id="screen-report" aria-labelledby="reportTitle">
    <div class="report-head">
      <h1 id="reportTitle">Quest complete!</h1>
      <div class="ring-wrap">
        <svg viewBox="0 0 120 120">
          <circle class="ring-track" cx="60" cy="60" r="52" fill="none" stroke-width="9"/>
          <circle class="ring-value" id="ringValue" cx="60" cy="60" r="52" fill="none" stroke-width="9"
                  stroke-dasharray="326.7" stroke-dashoffset="326.7"/>
        </svg>
        <div class="ring-label">
          <span class="pct" id="reportPct">0%</span>
          <span class="sub" id="reportFraction"></span>
        </div>
      </div>
      <div class="meta-row" id="reportMeta"></div>
    </div>

    <div class="domain-grid" id="domainGrid"></div>

    <div class="panel">
      <h3>What Lily is good at</h3>
      <ul id="strengthsList"></ul>
    </div>

    <div class="panel">
      <h3>What to practise next</h3>
      <ul id="growthList"></ul>
    </div>

    <div class="panel">
      <h3>Every question</h3>
      <div id="reviewList"></div>
    </div>

    <div class="actions" style="justify-content:center;margin-top:8px">
      <button class="btn btn--outline" id="printBtn" type="button">Save as PDF</button>
      <button class="btn btn--quiet" id="againBtn" type="button">Start again</button>
    </div>
  </section>

</div>

<!-- Firebase (optional). If these fail to load, or firebase-config.js still
     holds placeholders, the quest runs fine offline — sync just goes quiet. -->
<script defer src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script defer src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script defer src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>

<script defer src="firebase-config.js"></script>
<script defer src="sync.js"></script>
<script defer src="icons.js"></script>
<script defer src="app.js"></script>
</body>
</html>
